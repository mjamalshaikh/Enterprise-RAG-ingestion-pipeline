services:
  rag-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ${RAG_WORKER_IMAGE:-rag-ingestion:local}
    profiles: [workers]
    environment:
      RAG_ENVIRONMENT: ${RAG_ENVIRONMENT:-local}
      RAG_POSTGRES_DSN: ${RAG_POSTGRES_DSN:?set RAG_POSTGRES_DSN in .env}
      RAG_KAFKA_BOOTSTRAP_SERVERS: ${RAG_KAFKA_BOOTSTRAP_SERVERS:?set RAG_KAFKA_BOOTSTRAP_SERVERS in .env}
      RAG_APICURIO_URL: ${RAG_APICURIO_URL:?set RAG_APICURIO_URL in .env}
      RAG_MINIO_ENDPOINT: ${RAG_MINIO_ENDPOINT:?set RAG_MINIO_ENDPOINT in .env}
      RAG_MINIO_ACCESS_KEY: ${RAG_MINIO_ACCESS_KEY:?set RAG_MINIO_ACCESS_KEY in .env}
      RAG_MINIO_SECRET_KEY: ${RAG_MINIO_SECRET_KEY:?set RAG_MINIO_SECRET_KEY in .env}
      RAG_MINIO_SECURE: ${RAG_MINIO_SECURE:-false}
      RAG_QDRANT_URL: ${RAG_QDRANT_URL:?set RAG_QDRANT_URL in .env}
      RAG_QDRANT_API_KEY: ${RAG_QDRANT_API_KEY:?set RAG_QDRANT_API_KEY in .env}
      RAG_BGE_MODEL_NAME: ${RAG_BGE_MODEL_NAME:-BAAI/bge-m3}
      RAG_OTEL_SERVICE_NAME: ${RAG_OTEL_SERVICE_NAME:-rag-ingestion}
      RAG_OTEL_EXPORTER_OTLP_ENDPOINT: ${RAG_OTEL_EXPORTER_OTLP_ENDPOINT:?set RAG_OTEL_EXPORTER_OTLP_ENDPOINT in .env}
      RAG_OTEL_TRACES_SAMPLER: ${RAG_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      RAG_OTEL_TRACES_SAMPLER_ARG: ${RAG_OTEL_TRACES_SAMPLER_ARG:-1.0}
    command: ["--worker", "${RAG_WORKER_NAME:-document-fetcher}"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      otel-collector:
        condition: service_started
