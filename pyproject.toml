[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-rag-ingestion-pipeline"
version = "0.1.0"
description = "Event-driven, enterprise RAG ingestion pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35",
  "confluent-kafka>=2.6",
  "docling>=2.0",
  "fastavro>=1.10",
  "FlagEmbedding>=1.3",
  "httpx>=0.28",
  "opentelemetry-api>=1.30",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30",
  "opentelemetry-sdk>=1.30",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "prometheus-client>=0.21",
  "qdrant-client>=1.12",
  "sqlalchemy>=2.0",
  "asyncpg>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
